[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-eval-power"
version = "0.1.0"
description = "Statistical regression gate and power analyzer for RAG and LangGraph prompt suites."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Vaishnavi Lolla", email = "Vaishnavilolla@mycvcareer.com"},
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
evidence = [
    "pillow>=10.0",
    "weasyprint>=60.0",
]

[project.scripts]
prompt-eval-power = "prompt_eval_power.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
