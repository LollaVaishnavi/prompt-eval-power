name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests experiments tools

      - name: Run test suite with coverage
        run: |
          pytest --junitxml=junit.xml --cov=prompt_eval_power --cov-report=json:coverage.json --cov-report=xml:coverage.xml

      - name: Enforce 90% line coverage floor
        run: |
          python -c "
          import xml.etree.ElementTree as ET, sys
          rate = float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100.0
          print(f'Line coverage: {rate:.1f}%')
          sys.exit(0 if rate >= 90.0 else 1)
          "

      - name: Re-run experiments and verify receipts
        if: matrix.python-version == '3.11'
        run: |
          python experiments/exp01_small_suite_false_pass_rate.py
          python experiments/exp02_paired_vs_unpaired_power_gain.py
          python experiments/exp03_zero_failure_resolution_floor.py
          python experiments/exp04_langgraph_prompt_regression_audit.py
          python tools/collect_metrics.py --skip-tests --reuse-experiments
          python tools/check_numbers.py

      - name: Publish small-suite false-pass table to job summary
        if: matrix.python-version == '3.11'
        run: |
          python -c "
          import json, os
          from pathlib import Path
          exp01 = json.loads(Path('docs/experiments/exp01_small_suite_false_pass_rate.json').read_text())
          lines = [
              '### Small Prompt Eval Suite False-Pass Rate (10pp and 5pp Regressions)',
              '',
              '| Suite Size | Power (10pp) | False-Pass (10pp) | False-Pass (5pp) | MDE at 80% Power |',
              '| ---: | ---: | ---: | ---: | ---: |',
          ]
          for r in exp01['sample_sizes']:
              lines.append(
                  f\"| n={r['n_queries']} | {r['power_10pp_pct']:.1f}% | \"
                  f\"{r['false_pass_rate_10pp_pct']:.1f}% | {r['false_pass_rate_5pp_pct']:.1f}% | \"
                  f\"{r['mde_80_power_pp']:.1f} pp |\"
              )
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as fh:
                  fh.write('\n'.join(lines) + '\n')
          else:
              print('\n'.join(lines))
          "

      - name: Upload experiment artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            docs/experiments/*.json
            docs/metrics.json
